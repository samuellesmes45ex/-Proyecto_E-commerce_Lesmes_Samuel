<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - E-commerce</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="margin:0; background:#f5f5f5;">
    <div id="login-view" class="view active" style="display:none; height:100vh; justify-content:center; align-items:center; background:#000;">
        <div class="login-container" style="background:#fff; padding:40px; border-radius:8px; width:100%; max-width:400px;">
            <h2 style="margin-bottom:10px;">Admin Login</h2>
            <p style="color:#666; margin-bottom:20px;">Ingresa tus credenciales</p>
            <form id="login-form">
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Email</label>
                    <input type="email" id="login-email" required placeholder="admin@mail.com" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="123456" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                </div>
                <div id="login-error" style="color:red; margin-bottom:10px; display:none;"></div>
                <button type="submit" style="width:100%; padding:12px; background:#000; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Ingresar</button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="view" style="display:none; min-height:100vh; display:flex; flex-direction:row;">
        
        <admin-sidebar></admin-sidebar>
        
        <main class="dashboard-content" style="flex:1; display:flex; flex-direction:column; overflow-y:auto;">
            <admin-navbar></admin-navbar> 
            
            <div id="content-area" style="padding:30px;">
                </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
