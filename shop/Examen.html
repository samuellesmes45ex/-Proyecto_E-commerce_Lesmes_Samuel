<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - E-commerce</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="margin:0; background:#f5f5f5;">
        <div class="login-container" style="background:#fff; padding:40px; border-radius:8px; width:100%; max-width:400px;">
            <h2 style="margin-bottom:10px;">Ver Reportes</h2>
            <p style="color:#666; margin-bottom:20px;">Ingresa Año y mes.</p>
            <form id="login-form">
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Año</label>
                    <input type="email" id="login-email" required placeholder="Año" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Mes</label>
                    <input type="password" id="login-password" required placeholder="Mes" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                </div>
                <button type="submit" style="width:100%; padding:12px; background:#000; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">consultar</button>
            </form>
        </div>
    </div>
        
        

            
                </div>
        </main>
    </div>

    <script src="js/examen.js"></script>
</body>
</html>
