<!DOCTYPE html>
<html lang="es">

    <link rel="stylesheet" href="css/shop.css">
</head>
<body>

    <section class="hero" id="hero-section">

            <h1>Nueva Colección</h1>

            <button class="btn btn-dark" onclick="document.getElementById('products-section').scrollIntoView({behavior: 'smooth'})">Ver Productos</button>

    <main class="container" id="products-section">
        <div class="filters">

            <input type="text" id="search-input" placeholder="Buscar productos...">
        </div>
        <div class="products-grid" id="products-container">
            </div>

    <shop-cart></shop-cart>

    </footer>
